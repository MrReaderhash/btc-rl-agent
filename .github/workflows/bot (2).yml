name: 🤖 Trading Bot 24/7

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  telegram-bot:
    name: 📱 Telegram Bot
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 350

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install packages
        run: pip install requests pandas numpy

      - name: 🤖 Start Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "CSV files dhundh raha hoon..."
          if [ -f "btc_rl_agent/trades_log.csv" ]; then
            cp btc_rl_agent/trades_log.csv trades_log.csv
            echo "Agent 1 CSV mili!"
          fi
          if [ -f "subhashis_pani/sp_trades_log.csv" ]; then
            cp subhashis_pani/sp_trades_log.csv sp_trades_log.csv
            echo "Agent 2 CSV mili!"
          fi
          ls -la *.csv 2>/dev/null || echo "Koi CSV nahi abhi"
          python telegram_bot.py

  run-agent1:
    name: 🤖 Agent 1 (BTC RL)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install packages
        run: pip install ccxt pandas numpy gymnasium stable-baselines3 torch

      - name: 🔄 Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            btc_rl_agent/btc_data_full.csv
            btc_rl_agent/btc_rl_memory.zip
          key: agent1-data-${{ github.run_number }}
          restore-keys: agent1-data-

      - name: 🔄 Restore trades cache
        uses: actions/cache@v4
        with:
          path: btc_rl_agent/trades_log.csv
          key: agent1-trades-${{ github.run_number }}
          restore-keys: agent1-trades-

      - name: 🤖 Run Agent 1
        run: |
          cd btc_rl_agent
          python btc_rl_agent.py

      - name: 💾 Save logs
        run: |
          cp btc_rl_agent/trades_log.csv trades_log.csv 2>/dev/null || true
          git config user.name "Trading Bot"
          git config user.email "bot@trading.com"
          git add trades_log.csv btc_rl_agent/trades_log.csv || true
          git diff --staged --quiet || git commit -m "Agent 1 update $(date '+%Y-%m-%d %H:%M')"
          git push || true

  run-agent2:
    name: 🤖 Agent 2 (SP Agent)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install packages
        run: pip install ccxt pandas numpy gymnasium stable-baselines3 torch

      - name: 🔄 Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            subhashis_pani/sp_btc_data.csv
            subhashis_pani/sp_rl_model.zip
          key: agent2-data-${{ github.run_number }}
          restore-keys: agent2-data-

      - name: 🔄 Restore trades cache
        uses: actions/cache@v4
        with:
          path: subhashis_pani/sp_trades_log.csv
          key: agent2-trades-${{ github.run_number }}
          restore-keys: agent2-trades-

      - name: 🤖 Run Agent 2
        run: |
          cd subhashis_pani
          python subhashis_pani_agent.py

      - name: 💾 Save logs
        run: |
          cp subhashis_pani/sp_trades_log.csv sp_trades_log.csv 2>/dev/null || true
          git config user.name "Trading Bot"
          git config user.email "bot@trading.com"
          git add sp_trades_log.csv subhashis_pani/sp_trades_log.csv || true
          git diff --staged --quiet || git commit -m "Agent 2 update $(date '+%Y-%m-%d %H:%M')"
          git push || true
