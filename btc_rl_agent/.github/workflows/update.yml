name: BTC RL Agent - Daily Update

on:
  schedule:
    - cron: '0 * * * *'  # Har ghante chalega
  workflow_dispatch:  # Manual bhi chala sakte ho

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install libraries
      run: |
        pip install ccxt pandas numpy gymnasium stable-baselines3

    - name: Run update
      run: |
        cd btc_rl_agent
        python update.py

    - name: Save results
      uses: actions/commit-files@v1
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        message: "Agent update - trades log saved"
